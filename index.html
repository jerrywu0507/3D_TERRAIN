<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>月球南極地形</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      padding: 12px 16px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      line-height: 1.6;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="info">
    <strong>Artemis III / Shackleton DEM</strong><br>
    <span id="status">正在載入 Heightmap...</span><br>
    左鍵：旋轉<br>
    滾輪：縮放<br>
    右鍵：平移
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
